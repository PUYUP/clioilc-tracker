[package]
name = "clioilc"
version.workspace = true
edition.workspace = true
description = "CLI for clioilc file-change tracking"

[dependencies]
clioilc-claude = { path = "../readers/claude" }
clioilc-gemini = { path = "../readers/gemini" }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
ctrlc.workspace = true
clioilc-core.workspace = true
ureq = { version = "3", features = ["json"] }
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
getrandom = "0.3"
rpassword = "7"
gethostname = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
