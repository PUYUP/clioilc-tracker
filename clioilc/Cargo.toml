[package]
name = "clioilc"
version.workspace = true
edition.workspace = true
description = "CLI for clioilc file-change tracking"

[dependencies]
clioilc-claude = { path = "../readers/claude" }
clioilc-gemini = { path = "../readers/gemini" }
clioilc-devin = { path = "../readers/devin" }
clioilc-antigravity = { path = "../readers/antigravity" }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
ctrlc.workspace = true
clioilc-core.workspace = true
ureq = { version = "3", features = ["json"] }
aes-gcm = "0.10"
# E2E format v2 (team keys): HPKE with X-Wing (ML-KEM-768 + X25519), Ed25519.
# Pinned: X-Wing follows an IETF draft, so upgrades must pass the v2 fixture.
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "getrandom", "aes", "hkdfsha2", "mlkem", "x25519"] }
ed25519-dalek = "3"
sha2.workspace = true
argon2 = "0.5"
base64 = "0.22"
getrandom = "0.3"
rpassword = "7"
gethostname = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
